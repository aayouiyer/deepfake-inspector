name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The tests don't load the ML models, so skip torch/transformers to keep CI fast.
      - run: grep -viE '^(torch|transformers)' requirements.txt > requirements-ci.txt && pip install -r requirements-ci.txt
      - run: pytest -q
